<!DOCTYPE html>
<html>
<head>
  <title>Pricing Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Pricing</h2>

    <label class="switch">
      <input type="checkbox" id="toggle" onchange="changePrice()">
      <span></span>
    </label>

    <p id="price">$10 / month</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
